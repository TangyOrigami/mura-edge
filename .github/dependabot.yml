# Monthly dependency PRs. Minor/patch updates are grouped into one PR per
# ecosystem; majors come one at a time. The roadmap holds back some majors
# for a planned upgrade with a full test-mode run, so they are ignored here.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
